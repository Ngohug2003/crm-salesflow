name: salesflow-crm

x-app: &app
  build:
    context: .
    target: runtime
  image: salesflow-crm-app:local
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./.env:/var/www/html/.env
    - salesflow-storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      target: web
    image: salesflow-crm-web:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - salesflow-storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 8

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-salesflow}
      POSTGRES_USER: ${DB_USERNAME:-salesflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - salesflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-salesflow} -d ${DB_DATABASE:-salesflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - salesflow-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  horizon:
    <<: *app
    command: php artisan horizon
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 15s
      timeout: 5s
      retries: 6

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[s]chedule:work' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[r]everb:start' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-salesflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - salesflow-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  salesflow-postgres:
  salesflow-redis:
  salesflow-storage:
  salesflow-minio:
